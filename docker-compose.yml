services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rapor_karakter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  builder:
    image: node:22
    working_dir: /app/builder/rapor-karakter-builder
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/rapor_karakter
    command: sh -c "npm install && npm run dev"

  runner:
    image: node:22
    working_dir: /app/runner/rapor-karakter-runner
    volumes:
      - .:/app
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/rapor_karakter
    command: sh -c "npm install && npm run dev"
    depends_on:
      - postgres

volumes:
  postgres_data:
